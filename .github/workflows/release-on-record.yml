name: Release on record

# Merging a change whose changelog records a new version IS the release.
# Every push to main re-proves the check lane across every supported PHP
# version, and when the newest recorded version has no tag yet, this
# workflow creates the tag through the repository API and publishes the
# GitHub release itself - a tag created by a workflow token triggers no
# other workflow, so publication happens here. Runs are idempotent: an
# already-tagged, already-released version makes this a verification-only
# run. Packagist follows tags through its GitHub integration, so no
# registry credential ever enters this repository's workflows.

on:
  push:
    branches:
      - main

permissions:
  contents: write

# Serialized so two pushes cannot race past the tag-existence check; the
# later run then finds the tag and verifies instead of colliding.
concurrency:
  group: release-on-record
  cancel-in-progress: false

jobs:
  check:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # v2.35.5
        with:
          php-version: ${{ matrix.php }}
          extensions: json, mbstring
          coverage: none
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install the library cleanly
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prove strict PSR-4 autoloading
        run: composer dump-autoload --strict-psr --optimize

      - name: Run the complete quality lane
        run: composer check

  release:
    name: Release the recorded version
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The newest release record is the FIRST second-level heading, so a
      # malformed record fails this run loudly instead of silently
      # releasing nothing or re-reading an older heading.
      - name: Read the newest recorded version
        id: record
        shell: bash
        run: |
          set -euo pipefail
          first="$(grep -m 1 -E '^## ' CHANGELOG.md || true)"
          if [ "$first" = "## Unreleased" ] || [ "$first" = "## [Unreleased]" ]; then
            first="$(grep -E '^## ' CHANGELOG.md | sed -n 2p)"
          fi
          if [ -z "$first" ]; then
            echo "::notice::CHANGELOG.md records no released version yet; nothing to release."
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version="$(sed -nE 's/^## \[?([0-9]+\.[0-9]+\.[0-9]+)\]?( .*)?$/\1/p' <<<"$first")"
          if [ -z "$version" ]; then
            echo "::error::The newest changelog heading does not parse as a release record: $first"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Only a confirmed 404 means the tag is missing; any other probe
      # failure stops the run rather than colliding with an existing tag.
      - name: Create the version tag when it is missing
        if: steps.record.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.record.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          probe_status=0
          probe="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" 2>&1)" || probe_status=$?
          if [ "$probe_status" -eq 0 ]; then
            echo "Tag v$VERSION already exists; leaving it untouched."
          elif grep -q 'HTTP 404' <<<"$probe"; then
            gh api "repos/$GITHUB_REPOSITORY/git/refs" \
              --field ref="refs/tags/v$VERSION" \
              --field sha="$GITHUB_SHA"
            echo "Created tag v$VERSION at $GITHUB_SHA."
          else
            echo "$probe"
            echo "::error::Could not determine whether tag v$VERSION exists."
            exit 1
          fi

      # The pin is read from the tagged commit, not this run's checkout,
      # so a heal-path release can never name a pin the tag does not carry.
      - name: Read the Studio pin at the tagged commit
        if: steps.record.outputs.version != ''
        id: pin
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.record.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          pin="$(gh api "repos/$GITHUB_REPOSITORY/contents/resources/studio-contract/PIN.json?ref=v$VERSION" --jq .content \
            | base64 -d | jq -r '.source.commit // .source.release // "unknown"')"
          echo "studio_pin=$pin" >> "$GITHUB_OUTPUT"

      - name: Publish the GitHub release when it is missing
        if: steps.record.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.record.outputs.version }}
          STUDIO_PIN: ${{ steps.pin.outputs.studio_pin }}
        shell: bash
        run: |
          set -euo pipefail
          probe_status=0
          probe="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$VERSION" 2>&1)" || probe_status=$?
          if [ "$probe_status" -eq 0 ]; then
            echo "Release v$VERSION already exists; leaving it untouched."
          elif grep -q 'HTTP 404' <<<"$probe"; then
            gh release create "v$VERSION" \
              --verify-tag \
              --title "v$VERSION" \
              --notes "Implements the Studio contract at pin \`$STUDIO_PIN\` (see resources/studio-contract/PIN.json). Changelog: CHANGELOG.md section $VERSION."
          else
            echo "$probe"
            echo "::error::Could not determine whether release v$VERSION exists."
            exit 1
          fi
