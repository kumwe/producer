name: Producer CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # v2.35.5
        with:
          php-version: ${{ matrix.php }}
          extensions: json, mbstring, simplexml, tokenizer, xmlwriter
          coverage: none
          tools: composer:2.10.3

      - name: Install the validated package toolchain
        run: |
          composer validate --strict
          composer install --no-interaction --no-progress --prefer-dist
          composer audit --abandoned=fail

      - name: Run the complete quality lane
        run: php tools/check.php

      - name: Prove the exact no-dev Composer archive
        shell: bash
        run: |
          set -euo pipefail
          archive_dir="$(mktemp -d)"
          package_dir="$(mktemp -d)"
          composer archive --format=zip --dir="$archive_dir"
          archives=("$archive_dir"/*.zip)
          if [ "${#archives[@]}" -ne 1 ] || [ ! -f "${archives[0]}" ]; then
            echo "::error::Composer did not create exactly one ZIP archive."
            exit 1
          fi
          unzip -q "${archives[0]}" -d "$package_dir"
          php tools/verify-archive.php "$package_dir"
          composer validate --strict --working-dir="$package_dir"
          composer install \
            --working-dir="$package_dir" \
            --no-interaction \
            --no-progress \
            --no-dev \
            --classmap-authoritative
          composer run smoke --working-dir="$package_dir"
