name: Producer CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # v2.35.5
        with:
          php-version: ${{ matrix.php }}
          extensions: json, mbstring
          coverage: none
          tools: composer:v2

      - name: Install the validated package toolchain
        run: |
          composer validate --strict
          composer install --no-interaction --no-progress --prefer-dist
          composer audit --abandoned=fail

      - name: Run the complete quality lane
        run: composer check

      - name: Verify the authoritative no-dev package autoloader
        run: |
          composer install --no-interaction --no-progress --prefer-dist --no-dev --classmap-authoritative
          php tools/autoload-smoke.php
