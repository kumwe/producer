name: Producer CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, mbstring, simplexml, tokenizer, xmlwriter, zip
          coverage: none
          tools: composer:2.10.3

      - name: Install the validated package toolchain
        run: |
          composer validate --strict
          composer install --no-interaction --no-progress --prefer-dist
          composer audit --abandoned=fail

      - name: Run the complete quality lane
        run: php tools/check.php

      - name: Prove the exact no-dev Composer archive
        shell: bash
        run: |
          set -euo pipefail
          archive_dir="$(mktemp -d)"
          package_dir="$(mktemp -d)"
          composer archive --format=zip --dir="$archive_dir"
          archives=("$archive_dir"/*.zip)
          if [ "${#archives[@]}" -ne 1 ] || [ ! -f "${archives[0]}" ]; then
            echo "::error::Composer did not create exactly one ZIP archive."
            exit 1
          fi
          unzip -q "${archives[0]}" -d "$package_dir"
          php tools/verify-archive.php "$package_dir"
          composer validate --strict --working-dir="$package_dir"
          composer install \
            --working-dir="$package_dir" \
            --no-interaction \
            --no-progress \
            --no-dev \
            --classmap-authoritative
          composer run smoke --working-dir="$package_dir"

      - name: Prove a fresh authoritative archive dependency consumer
        run: php tools/verify-clean-consumer.php

  release-tests:
    name: Release automation tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify release transitions and repository setup
        run: |
          bash tools/test-release-record.sh
          bash tools/test-release-integrity.sh
          bash tools/test-release-on-record.sh
          bash tools/test-configure-release-repositories.sh

  package-gate:
    name: Package gate
    if: always()
    needs: [check, release-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all package and release tests
        env:
          PACKAGE_RESULT: ${{ needs.check.result }}
          RELEASE_RESULT: ${{ needs.release-tests.result }}
        run: test "$PACKAGE_RESULT" = success && test "$RELEASE_RESULT" = success
